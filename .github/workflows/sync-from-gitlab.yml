name: Fast Mirror Sync from GitLab

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GITHUB_USER: a791143125-arch

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore mirror cache
        uses: actions/cache@v4
        with:
          path: /tmp/git-mirror-cache
          key: git-mirror-cache-${{ runner.os }}
          restore-keys: |
            git-mirror-cache-

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # SPEED OPTIMIZATION
          git config --global core.compression 0
          git config --global pack.window 0
          git config --global pack.threads 1
          git config --global protocol.version 2
          git config --global http.postBuffer 524288000

      - name: Sync main repository
        run: |
          set -e

          echo "📥 Syncing main repository..."

          git remote remove gitlab 2>/dev/null || true

          git remote add gitlab https://gitlab.linphone.org/BC/public/linphone-sdk.git

          git fetch --prune gitlab

          DEFAULT_BRANCH=$(git remote show gitlab | sed -n '/HEAD branch/s/.*: //p')

          echo "Default branch: $DEFAULT_BRANCH"

          git checkout "$DEFAULT_BRANCH" || true

          git merge "gitlab/$DEFAULT_BRANCH" \
            --allow-unrelated-histories \
            --no-edit || true

          git push origin "$DEFAULT_BRANCH"
          git push origin --tags || true

          echo "✅ Main repo synced"

      - name: Sync submodules in parallel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          mkdir -p /tmp/git-mirror-cache

          process_submodule() {
              submodule="$1"

              repo_name=$(echo "$submodule" | tr '/' '-')

              gitlab_url="https://gitlab.linphone.org/BC/public/${submodule}.git"

              github_url="https://${GITHUB_TOKEN}@github.com/${GITHUB_USER}/${repo_name}.git"

              cache_dir="/tmp/git-mirror-cache/$repo_name"

              echo ""
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "🔄 Processing: $submodule"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

              # check github repo
              if ! git ls-remote "$github_url" &>/dev/null; then
                  echo "🍴 Creating GitHub repo..."

                  curl -s \
                    -X POST \
                    -H "Authorization: token ${GITHUB_TOKEN}" \
                    -H "Accept: application/vnd.github+json" \
                    https://api.github.com/user/repos \
                    -d "{
                      \"name\":\"${repo_name}\",
                      \"private\":false
                    }" >/dev/null

                  sleep 8
              fi

              # init or update mirror
              if [ ! -d "$cache_dir" ]; then
                  echo "📦 Creating mirror cache..."

                  git clone \
                    --mirror \
                    "$gitlab_url" \
                    "$cache_dir"

              else
                  echo "⚡ Updating existing mirror..."

                  cd "$cache_dir"

                  git remote update --prune
              fi

              cd "$cache_dir"

              GITLAB_COMMIT=$(git ls-remote "$gitlab_url" HEAD | awk '{print $1}')
              GITHUB_COMMIT=$(git ls-remote "$github_url" HEAD | awk '{print $1}')

              if [ "$GITLAB_COMMIT" = "$GITHUB_COMMIT" ] && [ ! -z "$GITHUB_COMMIT" ]; then
                  echo "⏭️ Already synced"
                  echo "GitLab : ${GITLAB_COMMIT:0:7}"
                  echo "GitHub : ${GITHUB_COMMIT:0:7}"
                  return
              fi

              echo "🚀 Pushing mirror..."

              git push --mirror "$github_url"

              echo "✅ Synced: $submodule"
          }

          export -f process_submodule
          export GITHUB_USER
          export GITHUB_TOKEN

          SUBMODULES=(
              "bcg729"
              "bcmatroska2"
              "external/mbedtls"
              "external/bv16-floatingpoint"
              "external/speex"
              "external/libvpx"
              "external/opus"
              "external/gsm"
              "external/srtp"
              "external/libxml2"
              "external/zlib"
              "external/openh264"
              "external/libjpeg-turbo"
              "external/xerces-c"
              "external/soci"
              "external/sqlite3"
              "external/codec2"
              "external/decaf"
              "external/zxing-cpp"
              "external/vo-amrwbenc"
              "external/opencore-amr"
              "external/openldap"
              "external/jsoncpp"
              "external/libyuv"
              "external/liboqs"
              "external/dav1d"
              "external/aom"
              "external/rnnoise"
              "external/cpp-httplib"
          )

          printf '%s\n' "${SUBMODULES[@]}" | \
          xargs -I{} -P 6 bash -c 'process_submodule "$@"' _ {}

      - name: Update .gitmodules
        run: |
          set -e

          cat > .gitmodules << 'EOF'
          [submodule "bcg729"]
              path = bcg729
              url = https://github.com/a791143125-arch/bcg729.git

          [submodule "bcmatroska2"]
              path = bcmatroska2
              url = https://github.com/a791143125-arch/bcmatroska2.git

          [submodule "external/mbedtls"]
              path = external/mbedtls
              url = https://github.com/a791143125-arch/external-mbedtls.git

          [submodule "external/bv16-floatingpoint"]
              path = external/bv16-floatingpoint
              url = https://github.com/a791143125-arch/external-bv16-floatingpoint.git

          [submodule "external/speex"]
              path = external/speex
              url = https://github.com/a791143125-arch/external-speex.git

          [submodule "external/libvpx"]
              path = external/libvpx
              url = https://github.com/a791143125-arch/external-libvpx.git

          [submodule "external/opus"]
              path = external/opus
              url = https://github.com/a791143125-arch/external-opus.git

          [submodule "external/gsm"]
              path = external/gsm
              url = https://github.com/a791143125-arch/external-gsm.git

          [submodule "external/srtp"]
              path = external/srtp
              url = https://github.com/a791143125-arch/external-srtp.git

          [submodule "external/libxml2"]
              path = external/libxml2
              url = https://github.com/a791143125-arch/external-libxml2.git

          [submodule "external/zlib"]
              path = external/zlib
              url = https://github.com/a791143125-arch/external-zlib.git

          [submodule "external/openh264"]
              path = external/openh264
              url = https://github.com/a791143125-arch/external-openh264.git

          [submodule "external/libjpeg-turbo"]
              path = external/libjpeg-turbo
              url = https://github.com/a791143125-arch/external-libjpeg-turbo.git

          [submodule "external/xerces-c"]
              path = external/xerces-c
              url = https://github.com/a791143125-arch/external-xerces-c.git

          [submodule "external/soci"]
              path = external/soci
              url = https://github.com/a791143125-arch/external-soci.git

          [submodule "external/sqlite3"]
              path = external/sqlite3
              url = https://github.com/a791143125-arch/external-sqlite3.git

          [submodule "external/codec2"]
              path = external/codec2
              url = https://github.com/a791143125-arch/external-codec2.git

          [submodule "external/decaf"]
              path = external/decaf
              url = https://github.com/a791143125-arch/external-decaf.git

          [submodule "external/zxing-cpp"]
              path = external/zxing-cpp
              url = https://github.com/a791143125-arch/external-zxing-cpp.git

          [submodule "external/vo-amrwbenc"]
              path = external/vo-amrwbenc
              url = https://github.com/a791143125-arch/external-vo-amrwbenc.git

          [submodule "external/opencore-amr"]
              path = external/opencore-amr
              url = https://github.com/a791143125-arch/external-opencore-amr.git

          [submodule "external/openldap"]
              path = external/openldap
              url = https://github.com/a791143125-arch/external-openldap.git

          [submodule "external/jsoncpp"]
              path = external/jsoncpp
              url = https://github.com/a791143125-arch/external-jsoncpp.git

          [submodule "external/libyuv"]
              path = external/libyuv
              url = https://github.com/a791143125-arch/external-libyuv.git

          [submodule "external/liboqs"]
              path = external/liboqs
              url = https://github.com/a791143125-arch/external-liboqs.git

          [submodule "external/dav1d"]
              path = external/dav1d
              url = https://github.com/a791143125-arch/external-dav1d.git

          [submodule "external/aom"]
              path = external/aom
              url = https://github.com/a791143125-arch/external-aom.git

          [submodule "external/rnnoise"]
              path = external/rnnoise
              url = https://github.com/a791143125-arch/external-rnnoise.git
          EOF

          git add .gitmodules

          git commit -m "chore: update gitmodules" || true

          git push origin || true

      - name: Summary
        run: |
          echo "✅ Sync completed at $(date)"