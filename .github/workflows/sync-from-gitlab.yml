name: Sync and Fork All Submodules from GitLab

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GITHUB_USER: a791143125-arch

jobs:
  fork-submodules:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Fork all GitLab submodules to GitHub and wait for completion
        run: |
          GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          GITHUB_USER="${{ env.GITHUB_USER }}"
          
          declare -a SUBMODULES=(
              "bcg729"
              "bcmatroska2"
              "external/mbedtls"
              "external/bv16-floatingpoint"
              "external/speex"
              "external/libvpx"
              "external/opus"
              "external/gsm"
              "external/srtp"
              "external/libxml2"
              "external/zlib"
              "external/openh264"
              "external/libjpeg-turbo"
              "external/xerces-c"
              "external/soci"
              "external/sqlite3"
              "external/codec2"
              "external/decaf"
              "external/zxing-cpp"
              "external/vo-amrwbenc"
              "external/opencore-amr"
              "external/openldap"
              "external/jsoncpp"
              "external/libyuv"
              "external/liboqs"
              "external/dav1d"
              "external/aom"
              "external/rnnoise"
              "external/cpp-httplib"
          )
          
          echo "🚀 Starting fork and import process..."
          echo "Submodules to fork: ${#SUBMODULES[@]}"
          
          # Step 1: Submit all imports
          for submodule in "${SUBMODULES[@]}"; do
              repo_name=$(echo "$submodule" | tr '/' '-')
              gitlab_url="https://gitlab.linphone.org/BC/public/${submodule}.git"
              
              REPO_CHECK=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
                  "https://api.github.com/repos/$GITHUB_USER/$repo_name")
              
              if echo "$REPO_CHECK" | grep -q '"id"'; then
                  echo "✓ $repo_name exists"
              else
                  curl -s -X POST \
                      -H "Authorization: token $GITHUB_TOKEN" \
                      -H "Accept: application/vnd.github.v3+json" \
                      "https://api.github.com/user/imports" \
                      -d "{
                          \"vcs\": \"git\",
                          \"repository_name\": \"$repo_name\",
                          \"repository_description\": \"Linphone SDK: $submodule\",
                          \"private\": false,
                          \"repository_url\": \"$gitlab_url\"
                      }" > /dev/null
                  echo "→ $repo_name import started"
              fi
              sleep 1
          done
          
          echo ""
          echo "⏳ Waiting for all imports to complete..."
          
          # Step 2: Wait for all imports
          max_wait=1800  # 30 minutes
          wait_time=0
          check_interval=10
          
          while [ $wait_time -lt $max_wait ]; do
              all_complete=true
              
              for submodule in "${SUBMODULES[@]}"; do
                  repo_name=$(echo "$submodule" | tr '/' '-')
                  
                  REPO_CHECK=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
                      "https://api.github.com/repos/$GITHUB_USER/$repo_name")
                  
                  if ! echo "$REPO_CHECK" | grep -q '"id"'; then
                      all_complete=false
                      break
                  fi
              done
              
              if [ "$all_complete" = "true" ]; then
                  echo "✅ All submodules ready!"
                  break
              fi
              
              echo "⏳ Waiting... ($wait_time/$max_wait seconds)"
              sleep $check_interval
              wait_time=$((wait_time + check_interval))
          done

  sync:
    runs-on: ubuntu-latest
    needs: fork-submodules
    permissions:
      contents: write

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add GitLab remote
        run: |
          git remote add gitlab https://gitlab.linphone.org/BC/public/linphone-sdk.git || true
          git remote set-url gitlab https://gitlab.linphone.org/BC/public/linphone-sdk.git

      - name: Sync from GitLab
        run: |
          git fetch gitlab --tags
          git fetch gitlab main 2>/dev/null || git fetch gitlab master 2>/dev/null || true
          git merge gitlab/main --allow-unrelated-histories --no-edit 2>/dev/null || \
          git merge gitlab/master --allow-unrelated-histories --no-edit 2>/dev/null || true

      - name: Update submodules
        run: |
          git submodule foreach --recursive 'git fetch origin --tags 2>/dev/null || true'

      - name: Push to GitHub
        run: |
          git push origin --all --quiet 2>/dev/null || true
          git push origin --tags --quiet 2>/dev/null || true
          git submodule foreach --recursive 'git push origin HEAD:$(git rev-parse --abbrev-ref HEAD) --quiet 2>/dev/null || true'

      - name: Summary
        run: echo "✅ Sync completed at $(date)"