name: Sync from GitLab

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  # Allow manual trigger
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add GitLab remote
        run: |
          git remote add gitlab https://gitlab.linphone.org/BC/public/linphone-sdk.git || true
          git remote set-url gitlab https://gitlab.linphone.org/BC/public/linphone-sdk.git

      - name: Fetch from GitLab
        run: |
          git fetch gitlab --all --tags

      - name: Update submodules
        run: |
          git submodule update --init --recursive
          git submodule foreach --recursive git fetch origin
          git submodule foreach --recursive git merge origin/master || git submodule foreach --recursive git merge origin/main || true

      - name: Merge GitLab main branch
        run: |
          # Try to merge main branch if it exists, otherwise master
          git merge gitlab/main --allow-unrelated-histories --no-edit || git merge gitlab/master --allow-unrelated-histories --no-edit || echo "No changes to merge"

      - name: Push to GitHub
        run: |
          git push origin --all --force-with-lease
          git push origin --tags --force-with-lease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push submodule updates
        run: |
          git submodule foreach --recursive 'git push origin HEAD:refs/heads/master || git push origin HEAD:refs/heads/main || true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}